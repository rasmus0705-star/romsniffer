// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
function startGame() {
  if (AC.state === 'suspended') AC.resume();
  const splash = document.getElementById('splash');
  splash.classList.add('hiding');
  setTimeout(() => { splash.style.display = 'none'; }, 600);
  document.getElementById('game').style.display = 'block';
  document.getElementById('status-bar').classList.add('visible');
  renderProgress();
  renderLocation();
}

function renderProgress() {
  const strip = document.getElementById('progress-strip');
  strip.innerHTML = '';
  for (let i = 0; i < CONFIG.locations.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot' + (i < stopIndex ? ' done' : i === stopIndex ? ' active' : '');
    strip.appendChild(dot);
  }
}

function renderLocation() {
  const locIdx = team.order[stopIndex];
  const loc = CONFIG.locations[locIdx];
  answeredThisStop = 0;
  correctThisStop = 0;

  document.getElementById('sb-loc').textContent = stopIndex + 1;
  document.getElementById('sb-score').textContent = totalCorrect;

  const html = `
    <div class="location-card">
      <div class="loc-num">Punkt ${stopIndex + 1} af ${CONFIG.locations.length}</div>
      <div class="loc-name">${loc.name}</div>
      <div class="loc-desc">${loc.desc}</div>
    </div>
    ${loc.questions.map((q, qi) => `
      <div class="question-card" id="qc-${qi}">
        <div class="q-badge">SpÃ¸rgsmÃ¥l ${qi + 1}</div>
        <div class="q-text">${q.q}</div>
        <div class="options" id="opts-${qi}">
          ${q.opts.map((o, oi) => `
            <button class="opt-btn" data-qi="${qi}" data-oi="${oi}"
                    onclick="answer(${qi},${oi})">${o}</button>
          `).join('')}
        </div>
      </div>
    `).join('')}
    <div class="stop-result" id="stop-result">
      <div class="stop-score-big" id="stop-score-big">0/3</div>
      <div class="stop-score-label">rigtige dette punkt</div>
    </div>
    <button class="next-btn" id="next-btn" onclick="nextStop()">
      Videre til nÃ¦ste punkt â†’
    </button>
  `;
  document.getElementById('content').innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function answer(qi, oi) {
  const locIdx = team.order[stopIndex];
  const loc = CONFIG.locations[locIdx];
  const q = loc.questions[qi];
  const isCorrect = oi === q.correct;

  // Disable + show result
  const btns = document.querySelectorAll(`#opts-${qi} .opt-btn`);
  btns.forEach(btn => {
    btn.classList.add('disabled');
    const boi = parseInt(btn.dataset.oi);
    if (boi === q.correct) btn.classList.add('correct');
    else if (boi === oi && !isCorrect) { btn.classList.add('wrong', 'chosen'); }
  });

  if (isCorrect) { totalCorrect++; correctThisStop++; playCorrect(); }
  else { playWrong(); }
  answeredThisStop++;

  document.getElementById('sb-score').textContent = totalCorrect;

  // Send to Supabase
  sendAnswer({ locationId: loc.id, questionIndex: qi, selectedOption: oi, correct: isCorrect });

  // All answered?
  if (answeredThisStop >= loc.questions.length) {
    setTimeout(() => {
      document.getElementById('stop-score-big').textContent = `${correctThisStop}/3`;
      document.getElementById('stop-result').classList.add('visible');
      if (stopIndex < CONFIG.locations.length - 1) {
        document.getElementById('next-btn').classList.add('visible');
      } else {
        // Last stop â†’ finish
        setTimeout(showFinish, 1200);
      }
    }, 500);
  }
}

function nextStop() {
  stopIndex++;
  renderProgress();
  renderLocation();
}

function showFinish() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('status-bar').classList.remove('visible');
  document.getElementById('finish').classList.add('active');
  document.getElementById('finish-score').textContent = totalCorrect;
  document.getElementById('finish-return').innerHTML =
    `<strong>${team.returnTo}</strong><br><br>Godt gÃ¥et! Resultatet er registreret.`;
  playFanfare();
  sendCompletion();
}

//  SUPABASE SYNC
// â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
async function sendAnswer(data) {
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) return;
  try {
    await fetch(`${CONFIG.supabaseUrl}/rest/v1/answers`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': CONFIG.supabaseKey,
        'Authorization': `Bearer ${CONFIG.supabaseKey}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        event_id: CONFIG.eventId, team_id: teamId, team_name: team.name,
        location_id: data.locationId, question_index: data.questionIndex,
        selected_option: data.selectedOption, is_correct: data.correct,
        answered_at: new Date().toISOString()
      })
    });
  } catch(e) { console.warn('Sync fejl:', e); }
}

async function sendCompletion() {
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) return;
  try {
    await fetch(`${CONFIG.supabaseUrl}/rest/v1/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': CONFIG.supabaseKey,
        'Authorization': `Bearer ${CONFIG.supabaseKey}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        event_id: CONFIG.eventId, team_id: teamId, team_name: team.name,
        total_correct: totalCorrect, total_questions: CONFIG.locations.length * 3,
        completed_at: new Date().toISOString()
      })
    });
  } catch(e) { console.warn('Completion fejl:', e); }
}
